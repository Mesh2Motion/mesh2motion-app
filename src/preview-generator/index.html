<!DOCTYPE html>
<html lang="en">
    <head>
        <title style="display: none">Mesh2Motion Preview Generation</title>
        <link rel="icon" type="image/png" href="./images/favicon.png"/>
        <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico" />
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body style="margin: 0">
        <script type="module" src="./preview-generator.ts"></script>
        <link href="../styles.css" rel="stylesheet" crossorigin="anonymous" />

        <div style="position: absolute; top: 20px; right: 20px; display: flex; gap: 8px;">
            <button id="fit-camera-button" title="Zoom the camera so every pose of every animation fits in the preview">Fit camera</button>
            <button id="record-button">Record</button>
        </div>

        <div style="position: absolute; top: 60px; right: 20px; display: flex; flex-direction: column; align-items: flex-end; gap: 6px;">
            <span>Camera position</span>
            <pre id="camera-position-output" style="margin: 0; padding: 8px; font-size: 13px; user-select: all; background: rgba(0, 0, 0, 0.25); border-radius: 4px;"></pre>
            <button id="copy-camera-position-button">Copy camera position</button>
        </div>

        <div id="record-status" style="position: absolute; bottom: 20px; left: 20px; right: 20px;"></div>

        <select id="animation-file-dropdown" style="position: absolute; top: 20px; left: 20px;">
            <!-- populated dynamically from RigConfig -->
        </select>

    </body>
</html>
